<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Field map for the first GitHub Pages A record</title>
  <desc id="desc">Illustration, not a screenshot. In Cloudflare DNS records add Type A, Name at sign, IPv4 address 185.199.108.153, Proxy status DNS only, TTL Auto. Repeat using the remaining addresses in the article.</desc>
  <defs><style>
    .bg{fill:#111510}.panel{fill:#192018;stroke:#42503c;stroke-width:2}.field{fill:#111510;stroke:#56614f;stroke-width:1.5}.label{font:16px system-ui,sans-serif;fill:#b4beae}.value{font:21px ui-monospace,monospace;fill:#eef1e8}.title{font:600 26px system-ui,sans-serif;fill:#eef1e8}.accent{fill:#c5f78d}.note{font:16px ui-monospace,monospace;fill:#b4beae}
  </style></defs>
  <rect class="bg" width="960" height="560" rx="16"/>
  <text class="note" x="36" y="39">ILLUSTRATED FIELD MAP · NOT A SCREENSHOT</text>
  <text class="title" x="36" y="81">Add the first A record</text>
  <rect class="panel" x="36" y="108" width="888" height="352" rx="12"/>
  <text class="label" x="62" y="147">Type</text>
  <rect class="field" x="62" y="164" width="130" height="58" rx="6"/>
  <text class="value" x="82" y="201">A</text>
  <text class="label" x="222" y="147">Name</text>
  <rect class="field" x="222" y="164" width="180" height="58" rx="6"/>
  <text class="value" x="242" y="201">@</text>
  <text class="label" x="432" y="147">IPv4 address</text>
  <rect class="field" x="432" y="164" width="466" height="58" rx="6"/>
  <text class="value" x="452" y="201">185.199.108.153</text>
  <text class="label" x="62" y="268">Proxy status</text>
  <rect class="field" x="62" y="285" width="340" height="58" rx="6"/>
  <path d="M86 321c-12 0-12-17-2-18 0-14 22-17 27-4 15-3 22 22 5 22Z" fill="#9ca3af"/>
  <text class="value" x="140" y="322">DNS only</text>
  <text class="label" x="432" y="268">TTL</text>
  <rect class="field" x="432" y="285" width="180" height="58" rx="6"/>
  <text class="value" x="452" y="322">Auto</text>
  <text class="label" x="62" y="388">@ is the root domain: example.com</text>
  <text class="label" x="62" y="420">Save, then add a separate row for each remaining address.</text>
  <text class="accent" x="36" y="503" font-family="system-ui,sans-serif" font-size="19" font-weight="600">Four A records at @ + one CNAME at www</text>
  <text class="note" x="36" y="535">Use the full DNS tables in the article, including optional IPv6.</text>
</svg>
